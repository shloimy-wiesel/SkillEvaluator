<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Projects{% endblock %} · SkillEvaluator Studio</title>
<link rel="stylesheet" href="{{ url_for('static', path='studio.css') }}"></head>
<body><a class="skip" href="#main">Skip to content</a>
<header><nav aria-label="Workspace"><a class="brand" href="/"><b aria-hidden="true">S/</b> SkillEvaluator <span>Studio</span></a>
<a href="/" class="workspace-link">Projects</a></nav></header><main id="main" tabindex="-1">
{% if project %}<nav class="crumbs" aria-label="Breadcrumb"><a href="/">Projects</a>
{% block ancestors %}<span aria-hidden="true">/</span><a href="{{ url_for('project', project_id=project.id) }}">{{ project.name }}</a>{% endblock %}
<span aria-hidden="true">/</span><span aria-current="page">{{ self.title() }}</span></nav>{% endif %}
{% block content %}{% endblock %}</main>
<footer>SkillEvaluator Studio <span> / </span> Self-hosted workspace</footer></body></html>
